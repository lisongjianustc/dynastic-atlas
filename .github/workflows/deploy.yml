name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 数据纪律闸门。校验与断言不过就不部署 —— 一条画歪的边界不该有机会上线。
      #
      # tests/data 覆盖：数据校验器的元测试（逐条破坏不变式，证明闸门真的会拦）、
      # 点落断言（史地常识）、状态机不变式、几何原语、治理层、地点落位。
      # tests/state 与 tests/ui 覆盖 store 与面板。
      - name: 单元与数据测试
        run: npm run test

      - name: 数据体检报告（仅打印，不拦）
        run: npm run report

      - name: 构建
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
